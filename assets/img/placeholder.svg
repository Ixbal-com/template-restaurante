<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" preserveAspectRatio="xMidYMid slice">
  <!-- Imagen de relleno para los espacios de imagen; ver "Espacios de imagen" en AGENTS.md -->
  <defs>
    <radialGradient id="glow" cx="30%" cy="25%" r="90%">
      <stop offset="0" stop-color="#f3dfd3"/>
      <stop offset="1" stop-color="#e6d6c0"/>
    </radialGradient>
    <pattern id="dots" width="36" height="36" patternUnits="userSpaceOnUse">
      <circle cx="18" cy="18" r="2" fill="#a8482a" opacity=".12"/>
    </pattern>
  </defs>
  <rect width="1200" height="1200" fill="url(#glow)"/>
  <rect width="1200" height="1200" fill="url(#dots)"/>
  <g transform="translate(600 600)" fill="none" stroke="#a8482a" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" opacity=".45">
    <rect x="-90" y="-70" width="180" height="140" rx="18"/>
    <circle cx="-38" cy="-22" r="16"/>
    <path d="M-90 50 -30 -5 20 40 45 18 90 55"/>
  </g>
</svg>
